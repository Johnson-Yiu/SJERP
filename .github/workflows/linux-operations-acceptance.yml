name: Linux operations acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - codex/ci-resume-certification-01
      - codex/ui-delivery-closeout-04
      - codex/small-team-finance-closeout-02
      - codex/small-team-cancel-refund-01
      - codex/linux-operations-acceptance-20261104
      - codex/r1-prelaunch-consolidation-20261104
permissions:
  contents: read
jobs:
  media-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Exercise kernel read-only media fence
        shell: bash
        run: |
          set -Eeuo pipefail
          owned="$(mktemp -d "${RUNNER_TEMP}/sunjack-linux-acceptance.XXXXXXXX")"
          image="$owned/media.img"
          mountpoint="$owned/media"
          cleanup() {
            if mountpoint -q "$mountpoint"; then sudo umount "$mountpoint"; fi
            case "$owned" in "$RUNNER_TEMP"/sunjack-linux-acceptance.*) rm -rf -- "$owned";; *) exit 1;; esac
          }
          trap cleanup EXIT
          truncate -s 128M "$image"
          mkfs.ext4 -q -F "$image"
          mkdir "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chmod 777 "$mountpoint"
          export PYTHONPATH="$GITHUB_WORKSPACE/backend" MEDIA_TEST_ROOT="$mountpoint"
          python - <<'PY'
          import os
          from crm.services.operations_fence import verify_readonly_filesystem
          try:
              verify_readonly_filesystem(os.environ['MEDIA_TEST_ROOT'])
          except RuntimeError as error:
              print('WRITABLE_REJECTED:', error)
          else:
              raise SystemExit('Writable filesystem was incorrectly accepted')
          PY
          sudo mount -o remount,ro "$mountpoint"
          python - <<'PY'
          import os
          from crm.services.operations_fence import verify_readonly_filesystem
          print('READONLY_VERIFIED:', verify_readonly_filesystem(os.environ['MEDIA_TEST_ROOT']))
          PY
          if sh -c 'printf synthetic > "$MEDIA_TEST_ROOT/competing-write"'; then
            echo 'Competing write unexpectedly succeeded' >&2
            exit 1
          fi
          echo 'INDEPENDENT_WRITE_REJECTED'
          sudo mount -o remount,rw "$mountpoint"
          python - <<'PY'
          import os
          from crm.services.operations_fence import verify_readonly_filesystem
          try:
              verify_readonly_filesystem(os.environ['MEDIA_TEST_ROOT'])
          except RuntimeError as error:
              print('REMOUNT_REJECTED:', error)
          else:
              raise SystemExit('Removed protection was incorrectly accepted')
          PY
  postgres-role-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Check signed receipt rejection paths
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python backend/manage.py test crm.tests.test_operations_retention crm.tests.test_operations_receipt --verbosity 2
      - name: Exercise real PostgreSQL roles, media fence and signed recovery receipts
        shell: bash
        env:
          SUNJACK_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          SUNJACK_CI_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -Eeuo pipefail
          owned="$(mktemp -d "${RUNNER_TEMP}/sunjack-linux-pg-XXXXXXXX")"
          image="$owned/media.img"
          mountpoint="$owned/media"
          cleanup() {
            if mountpoint -q "$owned/full-volume"; then sudo umount "$owned/full-volume"; fi
            if mountpoint -q "$mountpoint"; then sudo umount "$mountpoint"; fi
            case "$owned" in "$RUNNER_TEMP"/sunjack-linux-pg-*)
              test ! -L "$owned"
              test "$(realpath "$owned")" = "$owned"
              sudo rm -rf --one-file-system -- "$owned"
              ;;
              *) exit 1;;
            esac
          }
          trap cleanup EXIT
          truncate -s 128M "$image"
          mkfs.ext4 -q -F "$image"
          mkdir "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chmod 777 "$mountpoint"
          mkdir "$owned/runtime-temp"
          export TMPDIR="$owned/runtime-temp"
          export PYTHONPATH="$GITHUB_WORKSPACE/backend" SUNJACK_CI_ROOT="$owned"
          python backend/crm/tests/linux_operations_pg_acceptance.py
  nginx-private-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Install Nginx if necessary
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
          fi
      - name: Verify real TLS proxy, private media and process restart
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python backend/crm/tests/linux_nginx_acceptance.py
